name: Desktop-App bauen (.deb + AppImage)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhaengigkeiten installieren
        run: npm install

      - name: Fuer Electron neu bauen (better-sqlite3)
        run: npx electron-builder install-app-deps

      - name: Pakete bauen
        run: npm run build

      - name: Artifacts hochladen (jeder Build)
        uses: actions/upload-artifact@v4
        with:
          name: vokabel-werkstatt-installer
          path: |
            dist/*.deb
            dist/*.AppImage

      - name: Release erstellen (bei Tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.AppImage
